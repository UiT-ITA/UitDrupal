apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${app_name}-db
spec:
  instances: 2
  imagePullPolicy: IfNotPresent
  bootstrap:
    initdb:
    recovery:
      source: source
      database: ${app_name}
      owner: ${app_name}
      secret:
        name: ${app_name}-db-secret
      # recoveryTarget:
      #   # Time base target for the recovery
      #   targetTime: "2026-02-12 01:00:00.00000+01"
  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: bgo1-clone-objectstore
          serverName: profile-db
