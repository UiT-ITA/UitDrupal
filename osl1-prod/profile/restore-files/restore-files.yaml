apiVersion: batch/v1
kind: Job
metadata:
  name: ${app_name}-drupal-files-restore
spec:
  backoffLimit: 0
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
        - name: gitapp-adm-it-pub-systembruker
      containers:
        - name: restore-files
          image: git.app.uib.no:4567/itpublic/dockerimages/awscli/amazon/aws-cli:2.33.7
          command:
            - /bin/sh
            - -c
            - "/sync-s3-script/script.sh $SOURCE_S3 /files"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "2Gi"
              cpu: "1"
          volumeMounts:
            - name: files
              mountPath: /files
            - name: sync-s3-script
              mountPath: /sync-s3-script
              readOnly: true
          env:
            - name: SOURCE_S3
              value: s3://profile.uib.no/bgo1-prod/profile/files
            - name: AWS_ENDPOINT_URL
              value: https://object.api.bgo.nrec.no
            - name: DELETE
              value: "true"
            - name: AWS_REGION
              value: None
            - name: AWS_REQUEST_CHECKSUM_CALCULATION
              value: when_required
            - name: AWS_RESPONSE_CHECKSUM_VALIDATION
              value: when_required
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ${app_name}-prod-s3-secret
                  key: access
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ${app_name}-prod-s3-secret
                  key: secret
      restartPolicy: Never
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: ${app_name}-files
        - name: sync-s3-script
          configMap:
            name: sync-s3-script
            defaultMode: 0755
