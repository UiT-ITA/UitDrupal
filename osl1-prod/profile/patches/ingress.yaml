# TODO: Improve this patch
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${app_name}-nginx
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range:
spec:
  rules:
  - host: profile.uib.no
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ${app_name}-nginx
            port:
              number: 80
  tls:
  - hosts:
    - profile.uib.no
    secretName: ${app_name}.${rail_region}.${rail_env}.rail.uib.no-tls