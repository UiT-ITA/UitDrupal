# TODO: Improve this patch
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${app_name}-nginx
spec:
  rules:
  - host: ${app_name}.${rail_region}.${rail_env}.rail.uib.no
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ${app_name}-nginx
            port:
              number: 80
  - host: ${app_name}.test.uib.no
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ${app_name}-nginx
            port:
              number: 80
  tls:
  - hosts:
    - ${app_name}.${rail_region}.${rail_env}.rail.uib.no
    - ${app_name}.test.uib.no
    secretName: ${app_name}.${rail_region}.${rail_env}.rail.uib.no-tls