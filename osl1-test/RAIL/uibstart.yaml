apiVersion: hnc.x-k8s.io/v1alpha2
kind: SubnamespaceAnchor
metadata:
  name: adm-it-pub-uibstart
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: adm-it-pub-uibstart
spec:
  sourceRef:
    kind: GitRepository
    name: adm-it-pub
  path: ${rail_cluster}/uibstart
  targetNamespace: adm-it-pub-uibstart
  prune: true
  wait: true
  interval: 30m0s
  retryInterval: 2m0s
  timeout: 3m0s
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  postBuild:
    substitute:
      app_name: uibstart
      image_pull_secret_name: gitapp-adm-it-pub-systembruker
      rail_cluster: osl1-test
      rail_env: test
      rail_region: osl1
      drupal_trusted_host_patterns: '^(test\.)?uibstart(-novarnish)?(\.osl1\.test\.rail\.uib\.no|\.test\.uib\.no|\.no)$'
      drupal_env: test
      varnish_server_replicas: "1"
      uibstart_nginx_service: uibstart-nginx
---
# post deploy
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: adm-it-pub-uibstart-post-deploy
spec:
  dependsOn:
    - name: adm-it-pub-uibstart
  sourceRef:
    kind: GitRepository
    name: adm-it-pub
  path: ${rail_cluster}/uibstart/post-deploy
  targetNamespace: adm-it-pub-uibstart
  prune: true
  wait: true
  force: true
  interval: 30m0s
  retryInterval: 2m0s
  timeout: 3m0s
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  postBuild:
    substitute:
      app_name: uibstart
      image_pull_secret_name: gitapp-adm-it-pub-systembruker
      rail_cluster: osl1-test
      rail_env: test
      rail_region: osl1
      drupal_trusted_host_patterns: '^(test\.)?uibstart(-novarnish)?(\.osl1\.test\.rail\.uib\.no|\.test\.uib\.no|\.no)$'
      drupal_env: test
