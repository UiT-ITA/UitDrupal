apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${app_name}-mariadb
spec:
  template:
    spec:
      containers:
        - name: mariadb
          env:
            - name:  MARIADB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: ${app_name}-mariadb-secret
                  key: database
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: ${app_name}-mariadb-secret
                  key: username
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${app_name}-mariadb-secret
                  key: password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${app_name}-mariadb-secret
                  key: root-password
