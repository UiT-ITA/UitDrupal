apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${app_name}-php-fpm
spec:
  template:
    spec:
      containers:
        - name: ${app_name}-php-fpm
          volumeMounts:
            - name: php-config-overrides
              mountPath: /usr/local/etc/php/conf.d/zzz-php-fpm.ini
              subPath: zzz-php-fpm.ini
              readOnly: true
      volumes:
        - name: php-config-overrides
          configMap:
            name: php-config-overrides