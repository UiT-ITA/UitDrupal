apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../components/mariadb
  - ../../base/uib-drupal-site
  - cronjob-db-restore.yaml
  - cronjob-test-migrations.yaml
  - secret-db.yaml
  - secret-mariadb.yaml
#  - secret-skeivtarkiv-test-s3.yaml

replicas:
  - name: ${app_name}-php-fpm
    count: 1
images:
  - name: PATCH_NGINX_IMAGE
    newName: git.app.uib.no:4567/uib-ub/skeivtarkiv/drupal/skeivtarkiv-nginx # {"$imagepolicy": "adm-it-pub:skeivtarkiv-test-nginx-image-policy:name"}
    newTag: test-148 # {"$imagepolicy": "adm-it-pub:skeivtarkiv-test-nginx-image-policy:tag"}
  - name: PATCH_PHP_FPM_IMAGE
    newName: git.app.uib.no:4567/uib-ub/skeivtarkiv/drupal/skeivtarkiv-php-fpm # {"$imagepolicy": "adm-it-pub:skeivtarkiv-test-php-fpm-image-policy:name"}
    newTag: test-148 # {"$imagepolicy": "adm-it-pub:skeivtarkiv-test-php-fpm-image-policy:tag"}
patches:
  - path: patches/ingress.yaml
  - path: patches/patch-cron-job-drush-cron-config-overrides.yaml
  - path: patches/patch-cron-job-drush-cron-env.yaml
  - path: patches/patch-cron-job-drush-cron-resources.yaml
  - path: patches/patch-cron-job-drush-cron-schedule.yaml
  - path: patches/patch-deployment-php-fpm-config-overrides.yaml
  - path: patches/patch-deployment-php-fpm-env.yaml
  - path: patches/patch-deployment-php-fpm-opcache.yaml
  - path: patches/patch-deployment-php-fpm-resources.yaml
  - path: patches/patch-statefulset-mariadb-secret-name.yaml
configMapGenerator:
  - name: download-today-s3-script
    files:
      - script.sh=../../scripts/download-today-s3/download-today-s3.sh
  - name: restore-pg-db-script
    files:
      - script.sh=scripts/restore-pg-db.sh
  - name: opcache-config
    files:
      - zzz-php-opcache.ini=opcache.ini
  - name: php-config-overrides
    files:
      - zzz-php-fpm.ini=php-overrides.ini
