    newName: git.app.uib.no:4567/it/site/profile.uib.no/profile-php-fpm # {"$imagepolicy": "adm-it-pub:profile-next-major-php-fpm-image-policy:name"}
    newTag: next-major-2461 # {"$imagepolicy": "adm-it-pub:profile-next-major-php-fpm-image-policy:tag"}
patches:
  - path: patches/ingress.yaml
