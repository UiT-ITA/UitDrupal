apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${app_name}-redirects
  annotations:
    nginx.ingress.kubernetes.io/permanent-redirect: https://uibstart.test.uib.no
spec:
  rules:
  - host: test.uibstart.no
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: varnish-cache
            port:
              number: 6081
  tls:
  - hosts:
    - test.uibstart.no
    secretName: ${app_name}-redirect-tls
