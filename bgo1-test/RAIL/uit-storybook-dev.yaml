apiVersion: hnc.x-k8s.io/v1alpha2
kind: SubnamespaceAnchor
metadata:
  name: uit-it-webadm-uit-storybook-dev
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: uit-it-webadm-uit-storybook-dev
spec:
  sourceRef:
    kind: GitRepository
    name: uit-it-webadm
  path: bgo1-test/uit-storybook-dev
  targetNamespace: uit-it-webadm-uit-storybook-dev
  prune: true
  wait: true
  interval: 30m0s
  retryInterval: 2m0s
  timeout: 3m0s
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  postBuild:
    substitute:
      app_name: uit-storybook
      app_env: dev
      rail_cluster: bgo1-test
      rail_env: test
      rail_region: bgo1
      image_pull_secret_name: uitcontainerregistry
      # Drupal that renders the stories: the nginx of uit-web-dev.
      storybook_drupal_backend: nginx.uit-it-webadm-uit-web-dev.svc.cluster.local:8080
