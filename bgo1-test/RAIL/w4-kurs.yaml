apiVersion: hnc.x-k8s.io/v1alpha2
kind: SubnamespaceAnchor
metadata:
  name: adm-it-pub-w4-kurs
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: adm-it-pub-w4-kurs
spec:
  sourceRef:
    kind: GitRepository
    name: adm-it-pub
  path: ${rail_cluster}/w4-kurs
  targetNamespace: adm-it-pub-w4-kurs
  prune: true
  wait: true
  interval: 30m0s
  retryInterval: 2m0s
  timeout: 3m0s
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  postBuild:
    substitute:
      app_name: w4-kurs
      image_pull_secret_name: gitapp-adm-it-pub-systembruker
      rail_cluster: bgo1-test
      rail_env: test
      rail_region: bgo1
      drupal_trusted_host_patterns: '^w4-kurs(-novarnish)?(\.bgo1\.test\.rail\.uib\.no|\.test\.uib\.no)$'
      drupal_env: test
      w4_nginx_service: w4-kurs-nginx
      # Varnish-cluster resources
      VARNISH_SERVER_CPU_LIMIT: 500m
      VARNISH_SERVER_CPU_REQUEST: 100m
      VARNISH_SERVER_MEMORY_REQUEST: 256M
      VARNISH_SERVER_MEMORY_LIMIT: 256M
      VARNISH_SIZE: 128m
---
# post deploy
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: adm-it-pub-w4-kurs-post-deploy
spec:
  dependsOn:
    - name: adm-it-pub-w4-kurs
  sourceRef:
    kind: GitRepository
    name: adm-it-pub
  path: ${rail_cluster}/w4-kurs/post-deploy
  targetNamespace: adm-it-pub-w4-kurs
  prune: true
  wait: true
  force: true
  interval: 30m0s
  retryInterval: 2m0s
  timeout: 3m0s
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  postBuild:
    substitute:
      app_name: w4-kurs
      image_pull_secret_name: gitapp-adm-it-pub-systembruker
      rail_cluster: bgo1-test
      rail_env: test
      rail_region: bgo1
      drupal_trusted_host_patterns: '^w4-kurs(-novarnish)?\.bgo1\.test\.rail\.uib\.no$'
      drupal_env: test
      w4_nginx_service: w4-kurs-nginx
