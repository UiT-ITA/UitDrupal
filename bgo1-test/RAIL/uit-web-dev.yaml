apiVersion: hnc.x-k8s.io/v1alpha2
kind: SubnamespaceAnchor
metadata:
  name: uit-it-webadm-uit-web-dev
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: uit-it-webadm-uit-web-dev
spec:
  sourceRef:
    kind: GitRepository
    name: uit-it-webadm
  path: bgo1-test/uit-web-dev
  targetNamespace: uit-it-webadm-uit-web-dev
  prune: true
  wait: true
  interval: 30m0s
  retryInterval: 2m0s
  timeout: 10m0s
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  postBuild:
    substitute:
      app_name: uit-web
      app_env: dev
      rail_cluster: bgo1-test
      rail_env: test
      rail_region: bgo1
      s3_bucket: UiT-NREC-webportal-backup-test-00
      s3_endpoint: s3.eu-central-003.backblazeb2.com
      s3_region: eu-central-003
      backup_schedule_db: '0 0 21 * * *'
      backup_schedule_files: '5-59/15 * * * *'
      backup_suspend_files: "true"
      image_pull_secret_name: uitcontainerregistry
