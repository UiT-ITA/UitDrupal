apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${app_name}-db-restore-cron
spec:
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: ${app_name}-db-restore-cron
        spec:
          containers:
            - name: drush-run-query
              env:
                - name: DRUPAL_UIB_ENV
                  value: test-s3
                - name: DRUPAL_UIB_S3_REGION
                  value: 'None'
                - name: DRUPAL_UIB_S3FS_REGION
                  value: 'None'
                - name: DRUPAL_UIB_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ${app_name}-s3-secret
                      key: access
                - name: DRUPAL_UIB_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ${app_name}-s3-secret
                      key: secret
                - name: DRUPAL_UIB_S3FS_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ${app_name}-s3fs-secret
                      key: access
                - name: DRUPAL_UIB_S3FS_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ${app_name}-s3fs-secret
                      key: secret
                - name: AWS_ENDPOINT_URL
                  value: 'https://object.api.bgo.nrec.no'
                - name: DRUPAL_UIB_S3_BUCKET
                  value: 'profile.uib.no-sandbox'
                - name: DRUPAL_UIB_S3FS_BUCKET
                  value: 'profile.uib.no-sandbox-s3'
