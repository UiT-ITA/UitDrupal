apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${app_name}-nginx
  annotations:
    # UiB's ip ranges and rail's ip ranges for the RAIL NAT gws
    nginx.ingress.kubernetes.io/whitelist-source-range: 129.177.0.0/16,2001:700:200::/48,158.39.77.248,158.39.74.248,158.37.63.248,158.39.75.248,2001:700:2:8303::/64,2001:700:2:8203::/64,2001:700:2:8302::/122,2001:700:2:8202::/122,158.37.65.0/24,158.39.77.0/24,158.39.74.0/24,158.39.201.0/24,158.37.63.0/24,158.37.66.0/24,158.39.75.0/24,158.39.48.0/24,158.39.200.0/24
spec:
  rules:
  - host: ${app_name}.${rail_region}.${rail_env}.rail.uib.no
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ${app_name}-nginx
            port:
              number: 80
  - host: profile.test.uib.no
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ${app_name}-nginx
            port:
              number: 80
  tls:
  - hosts:
    - ${app_name}.${rail_region}.${rail_env}.rail.uib.no
    - profile.test.uib.no
    secretName: ${app_name}.${rail_region}.${rail_env}.rail.uib.no-tls