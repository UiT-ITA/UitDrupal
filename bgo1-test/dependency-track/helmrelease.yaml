apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dependency-track
spec:
  interval: 5m0s
  chart:
    spec:
      chart: dependency-track
      version: '1.2.0'
      sourceRef:
        kind: HelmRepository
        name: dependencytrack
      interval: 1m
  values:
    common:
      nameOverride: ""
      fullnameOverride: "${app_name}"
      image:
        registry: git.app.uib.no:4567/itpublic/dockerimages
        pullSecrets: 
          - name: "${image_pull_secret_name}"
      secretKey:
        # -- Whether the chart should generate a secret key upon deployment.
        createSecret: false
        # -- Use the secret key defined in an existing secret.
        existingSecretName: "${app_name}"
      serviceAccount:
        # -- Whether the chart should generate a serviceAccount
        create: true
        annotations: {}
        # -- Use the name of the name of the release by default, or specify a custom name.
        name: "${app_name}"
        # -- Whether the serviceAccount should mount the token.
        automount: false
      # -- Whether service links should be added to the Pods
      enableServiceLinks: true

    apiServer:
      # -- The type of deployment. Can be either Deployment or StatefulSet.
      deploymentType: StatefulSet
      annotations: {}
      metrics:
        # -- Enable Prometheus scraping annotations on pods
        enabled: true
      image:
        # -- Override common.image.registry for the API server.
        registry: "git.app.uib.no:4567/itpublic/dockerimages"
        repository: dependency-track
        # -- Can be a tag name such as "latest", or an image digest
        # prefixed with "sha256:". Defaults to AppVersion of the chart.
        tag: "apiserver-4.14.2"
        pullPolicy: IfNotPresent
      command: []
      args: []
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          memory: 4Gi
      # -- Security context of the Pod.
      # Aids in preventing permission issues with persistent volumes.
      # For OpenShift, explicitly set this to null.
      podSecurityContext:
        fsGroup: 1000
      # -- Security context of the Container.
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
      persistentVolume:
        enabled: true
        className: "rook-cephfs"
        size: 25Gi
      extraEnv:
        - name: "ALPINE_DATABASE_PASSWORD"
          valueFrom:
            secretKeyRef:
              key: password
              name: ${app_name}-db-secret
        - name: "ALPINE_DATABASE_USERNAME"
          valueFrom:
            secretKeyRef:
              key: username
              name: ${app_name}-db-secret
        - name: ALPINE_DATABASE_DRIVER
          value: "org.postgresql.Driver"
        - name: ALPINE_DATABASE_URL
          value: "jdbc:postgresql://${app_name}-db-rw/${app_name}"
        - name: ALPINE_DATABASE_MODE
          value: "external"
        - name: LOGGING_CONFIG_PATH
          value: "logback-json.xml"
      extraEnvFrom: []
      # -- Additional containers to deploy. Supports templating.
      extraContainers: []
      extraPodLabels: {}
      tolerations: []
      probes:
        startup:
          path: "/health/started"
          failureThreshold: 30
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        liveness:
          path: "/health/live"
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 5
        readiness:
          path: "/health/ready"
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 5
      additionalVolumeMounts: []
      #   - name: foo
      #     mountPath: /bar
      additionalVolumes:
        []
        # - name: foo
        #   emptyDir: {}
      service:
        type: ClusterIP
        nodePort: ~
        annotations: {}
      serviceMonitor:
        enabled: false
        namespace: monitoring
        scrapeInterval: 60s
        scrapeTimeout: 30s
        labels: {}
      # -- Additional init containers to deploy. Supports templating.
      initContainers: []
      # Use the following to fix permissions on the /data volume,
      # IF USING podSecurityContext IS NOT POSSIBLE (i.e. for OpenShift).
      #
      # initContainers:
      # - name: fix-permissions
      #   image: docker.io/library/busybox
      #   command:
      #   - sh
      #   - -c
      #   - |
      #     chown -R 1000:1000 /data
      #   volumeMounts:
      #   - name: data
      #     mountPath: /data
      #   securityContext:
      #     capabilities:
      #       add:
      #       - CHOWN
      #     runAsNonRoot: false
      #     runAsUser: 0
      #     seccompProfile:
      #       type: RuntimeDefault
      nodeSelector: {}

    frontend:
      replicaCount: 1
      annotations: {}
      image:
        # -- Override common.image.registry for the frontend.
        registry: "git.app.uib.no:4567/itpublic/dockerimages"
        repository: dependency-track
        # -- Can be a tag name such as "latest", or an image digest
        # prefixed with "sha256:". Defaults to AppVersion of the chart.
        tag: "frontend-4.14.2"
        pullPolicy: IfNotPresent
      command: []
      args: []
      resources:
        requests:
          cpu: 150m
          memory: 64Mi
        limits:
          memory: 128Mi
      # -- Security context of the Pod.
      # Aids in preventing permission issues with persistent volumes.
      # For OpenShift, explicitly set this to null.
      podSecurityContext:
        fsGroup: 1000
      # -- Security context of the Container.
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        # RO filesystems are not supported by the frontend
        readOnlyRootFilesystem: false
        seccompProfile:
          type: RuntimeDefault
      extraEnv: []
        # - name: OIDC_ISSUER
        #   value: ""
        # - name: OIDC_CLIENT_ID
        #   value: ""
        # - name: OIDC_SCOPE
        #   value: ""
        # - name: OIDC_FLOW
        #   value: ""
        # - name: OIDC_LOGIN_BUTTON_TEXT
        #   value: ""
      extraEnvFrom: []
      # -- Additional containers to deploy. Supports templating.
      extraContainers: []
      extraPodLabels: {}
      tolerations: []
      probes:
        liveness:
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 5
        readiness:
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 5
      additionalVolumeMounts:
        []
        # - name: foo
        #   mountPath: /bar
      additionalVolumes:
        []
        # - name: foo
        #   emptyDir: {}
      service:
        type: ClusterIP
        nodePort: ~
        annotations: {}
      apiBaseUrl: "https://${app_name}.${rail_region}.${rail_env}.rail.uib.no"
      # -- Additional init containers to deploy. Supports templating.
      initContainers: []
      nodeSelector: {}

    ingress:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: harica
        cert-manager.io/private-key-algorithm: ECDSA
        cert-manager.io/usages: "digital signature"
        cert-manager.io/private-key-rotation-policy: Always
        nginx.ingress.kubernetes.io/whitelist-source-range: 129.177.0.0/16,2001:700:200::/48
      labels: {}
      hostname: "${app_name}.${rail_region}.${rail_env}.rail.uib.no"
      ingressClassName: "nginx"
      tls:
        - secretName: "${app_name}-tls"
          hosts:
            - "${app_name}.${rail_region}.${rail_env}.rail.uib.no"

    httpRoute:
      enabled: false
      annotations: {}
      labels: {}
      hostnames:
        - "${app_name}.${rail_region}.${rail_env}.rail.uib.no"
      parentRefs: []
      #  - name: my-gateway
      #    namespace: default
      #    sectionName: https

    # -- Create extra manifests via values.
    extraObjects:
      []
      # - apiVersion: "kubernetes-client.io/v1"
      #   kind: ExternalSecret
      #   metadata:
      #     name: tempo-secrets
      #   spec:
      #     backendType: aws
      #     data:
      #       - key: secret-access-key
      #         name: awssm-secret