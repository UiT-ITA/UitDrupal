apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/uitcontainerregistry-pull-secret
  - ../../base/uit-storybook
# Storybook image built by www.uit.no in the same job as uit-web-dev, so it has
# the same tag. Flux image automation updates it (policy storybook).
images:
  - name: uitcontainerregistry.azurecr.io/uit/www-uit-no-storybook
    newTag: uit-web-dev-2026-11-25T10-11-10Z # {"$imagepolicy": "uit-it-webadm-uit-storybook-dev:storybook:tag"}
