# TODO: Improve this patch
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${app_name}-nginx
spec:
  rules:
    # TODO: Should possibly not be app name, but fair default?
    - host: ${app_name}.${rail_region}.${rail_env}.rail.uib.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: varnish-cache
                port:
                  number: 6081
    - host: ${app_name}-novarnish.${rail_region}.${rail_env}.rail.uib.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${app_name}-nginx
                port:
                  number: 80
    - host: w4.test.uib.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: varnish-cache
                port:
                  number: 6081
    - host: w4-novarnish.test.uib.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${app_name}-nginx
                port:
                  number: 80
  tls:
    - hosts:
        - ${app_name}.${rail_region}.${rail_env}.rail.uib.no
        - ${app_name}-novarnish.${rail_region}.${rail_env}.rail.uib.no
        - w4.test.uib.no
        - w4-novarnish.test.uib.no
      secretName: ${app_name}.${rail_region}.${rail_env}.rail.uib.no-tls
