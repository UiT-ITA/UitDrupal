apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../components/drupal7
  - ../../components/mariadb
  - ../../base/git-pull-secrets
  - db-secret.yaml
  # Backup is not necessary for test environment
  # Must redo restore-files when potential production move
  # - backup-files.yaml
  # - backup-sql.yaml
  - restore-files.yaml
  - restore-sql.yaml
  - secret-s3.yaml
patches:
  - path: patches/nginx-image.yaml
  - path: patches/drupal-image.yaml
  - path: patches/drupal-image-cron-job.yaml
  - path: patches/ingress.yaml
configMapGenerator:
  - name: drush-sql-dump-script
    files:
      - script.sh=scripts/drush-sql-dump.sh
  - name: drush-sql-query-script
    files:
      - script.sh=scripts/drush-sql-query.sh
  - name: download-today-s3-script
    files:
      - script.sh=../../scripts/download-today-s3/download-today-s3.sh
  - name: upload-s3-script
    files:
      - script.sh=../../scripts/upload-s3/upload-s3.sh
images:
  - name: PATCH_NGINX_IMAGE
    newName: git.app.uib.no:4567/itpublic/dockerimages/nginx-unprivileged/nginxinc/nginx-unprivileged
    newTag: uib-v1.0.3
  - name: PATCH_PHP_FPM_IMAGE
    newName: git.app.uib.no:4567/uib-ub/skeivtarkiv/drupal-skeivtarkiv/skeivtarkiv
    newTag: test-286 # {"$imagepolicy": "adm-it-pub:skeivtarkiv-test-image-policy:tag"}
