# TODO: Remove
# This is just to test that copying site files to another container works fine. This allows us to run commands from a different docker image with the context of the site
# E.g drush + aws-cli

apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${app_name}-mariadb-sql-backup-cron
spec:
  schedule: "5 2 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Replace
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          volumes:
            - name: files
              persistentVolumeClaim:
                claimName: ${app_name}-files
            - name: database-dump
              emptyDir: {}
            - name: drush-sql-dump
              configMap:
                name: drush-sql-dump-script
                defaultMode: 0755
            - name: upload-s3-script
              configMap:
                name: upload-s3-script
                defaultMode: 0755
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            fsGroup: 33
          imagePullSecrets:
            - name: gitapp-adm-it-pub-systembruker
          initContainers:
            - name: dump-database
              image: PATCH_PHP_FPM_IMAGE
              command:
                [
                  "/drush-sql-dump/script.sh",
                  "/database-dump",
                  "skeivtarkiv-backup.sql.gz",
                ]
              volumeMounts:
                - mountPath: /database-dump
                  name: database-dump
                - mountPath: /var/www/html/sites/default/files
                  name: files
                  readOnly: true
                - mountPath: /drush-sql-dump
                  name: drush-sql-dump
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  memory: "128M"
                  cpu: "50m"
                limits:
                  memory: "128M"
              env:
                - name: DRUPAL_DATABASE_HOST
                  value: ${app_name}-mariadb
                - name: DRUPAL_DATABASE_PREFIX
                  value: ""
                - name: DRUPAL_DATABASE_NAME
                  valueFrom:
                    secretKeyRef:
                      name: ${app_name}-db-secret
                      key: database
                - name: DRUPAL_DATABASE_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: ${app_name}-db-secret
                      key: username
                - name: DRUPAL_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${app_name}-db-secret
                      key: password
          containers:
            - name: upload-s3
              image: git.app.uib.no:4567/itpublic/dockerimages/awscli/amazon/aws-cli:2.33.7
              command:
                - /bin/sh
                - -c
                - "/upload-s3-script/script.sh skeivtarkiv-backups/test/db/db-{DAY_OF_WEEK}.sql.gz /dump/developer-database.sql.gz/database-dump/skeivtarkiv-backup.sql.gz"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  memory: "128M"
                  cpu: "50m"
                limits:
                  memory: "128M"
              volumeMounts:
                - mountPath: /database-dump
                  name: database-dump
                  readOnly: true
                - mountPath: /upload-s3-script
                  name: upload-s3-script
                  readOnly: true
              env:
                - name: SCRIPT
                  value: upload-s3
                - name: S3_BUCKET
                  value: skeivtarkiv.no
                - name: AWS_REGION
                  value: None
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: ${app_name}-drupal-s3-secret
                      key: access
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ${app_name}-drupal-s3-secret
                      key: secret
                - name: AWS_ENDPOINT_URL
                  value: https://object.api.bgo.nrec.no
          restartPolicy: Never
