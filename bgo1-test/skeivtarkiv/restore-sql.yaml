apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${app_name}-mariadb-sql-restore-cron
spec:
  schedule: "5 3 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Replace
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          volumes:
            - name: files
              persistentVolumeClaim:
                claimName: ${app_name}-files
            - name: database-dump
              emptyDir: {}
            - name: drush-sql-query
              configMap:
                name: drush-sql-query-script
                defaultMode: 0755
            - name: download-today-s3
              configMap:
                name: download-today-s3-script
                defaultMode: 0755
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            fsGroup: 33
          imagePullSecrets:
            - name: gitapp-adm-it-pub-systembruker
          initContainers:
            - name: download-today-s3-script
              image: git.app.uib.no:4567/itpublic/dockerimages/awscli/amazon/aws-cli:2.33.7
              command:
                - /bin/sh
                - -c
                - "/download-today-s3/script.sh $S3_PATH $OUTPUT_PATH"
              volumeMounts:
                - mountPath: /database-dump
                  name: database-dump
                - mountPath: /download-today-s3
                  name: download-today-s3
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  memory: "128M"
                  cpu: "50m"
                limits:
                  memory: "128M"
              env:
                - name: OUTPUT_PATH
                  value: /database-dump/skeivtarkiv-backup.sql.gz
                - name: S3_PATH
                  value: skeivtarkiv-backups/prod/db/db-{DAY_OF_WEEK}.sql.gz
                - name: S3_BUCKET
                  value: skeivtarkiv.no
                - name: AWS_REGION
                  value: None
                # TODO: Different secret?
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: ${app_name}-drupal-s3-secret
                      key: access
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ${app_name}-drupal-s3-secret
                      key: secret
                - name: AWS_ENDPOINT_URL
                  value: https://object.api.bgo.nrec.no
          containers:
            - name: drush-run-query
              image: PATCH_PHP_FPM_IMAGE
              command:
                [
                  "/drush-sql-query/script.sh",
                  "/database-dump/skeivtarkiv-backup.sql.gz",
                ]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  memory: "128M"
                  cpu: "50m"
                limits:
                  memory: "128M"
              volumeMounts:
                - mountPath: /database-dump
                  name: database-dump
                - mountPath: /var/www/html/sites/default/files
                  name: files
                  readOnly: true
                - mountPath: /drush-sql-query
                  name: drush-sql-query
                  readOnly: true
              env:
                - name: DRUPAL_DATABASE_HOST
                  value: ${app_name}-mariadb
                - name: DRUPAL_DATABASE_PREFIX
                  value: ""
                - name: DRUPAL_DATABASE_NAME
                  valueFrom:
                    secretKeyRef:
                      name: ${app_name}-db-secret
                      key: database
                - name: DRUPAL_DATABASE_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: ${app_name}-db-secret
                      key: username
                - name: DRUPAL_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${app_name}-db-secret
                      key: password
          restartPolicy: Never
