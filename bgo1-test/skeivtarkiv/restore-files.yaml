apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${app_name}-drupal-files-restore-cron
spec:
  schedule: "5 3 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Replace
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            fsGroup: 33
          imagePullSecrets:
            - name: gitapp-adm-it-pub-systembruker
          initContainers:
            - name: download-today-s3-script
              image: git.app.uib.no:4567/itpublic/dockerimages/awscli/amazon/aws-cli:2.33.7
              command:
                - /bin/sh
                - -c
                - "/download-today-s3/script.sh $S3_PATH $OUTPUT_PATH"
              volumeMounts:
                - mountPath: /file-dump
                  name: file-dump
                - mountPath: /download-today-s3
                  name: download-today-s3
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  memory: "2G"
                  cpu: "50m"
                limits:
                  memory: "2G"
              env:
                - name: OUTPUT_PATH
                  value: /file-dump/skeivtarkiv-files.tar.gz
                - name: S3_PATH
                  value: skeivtarkiv-backups/prod/files/files-{DAY_OF_WEEK}.tar.gz
                - name: S3_BUCKET
                  value: skeivtarkiv.no
                - name: AWS_REGION
                  value: None
                # TODO: Different secret?
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: ${app_name}-drupal-s3-secret
                      key: access
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ${app_name}-drupal-s3-secret
                      key: secret
                - name: AWS_ENDPOINT_URL
                  value: https://object.api.bgo.nrec.no
          containers:
            - name: restore-files
              image: PATCH_PHP_FPM_IMAGE
              command:
                - /bin/sh
                - -c
                - "rm -rf /files/* && tar -xzf /file-dump/skeivtarkiv-files.tar.gz -C /files --strip-components=1"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  memory: "2G"
                  cpu: "250m"
                limits:
                  memory: "2G"
              volumeMounts:
                - name: files
                  mountPath: /files
                - name: file-dump
                  mountPath: /file-dump
          restartPolicy: Never
          volumes:
            - name: files
              persistentVolumeClaim:
                claimName: ${app_name}-files
            - name: file-dump
              emptyDir: {}
            - name: download-today-s3
              configMap:
                name: download-today-s3-script
                defaultMode: 0755
