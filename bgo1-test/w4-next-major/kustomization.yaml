apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/w4/test
  - secret-db.yaml
  - secret-rabbitmq.yaml
  - secret-valkey.yaml
  - secret-varnish-secret.yaml
replicas:
  - name: ${app_name}-php-fpm
    count: 1
patches:
  - path: patches/patch-cronjob-drupal-cron.yaml
  - path: patches/files-size.yaml
  - path: patches/ingress.yaml
  - path: patches/patch-helmrelease-valkey.yaml
  - path: patches/patch-statefulset-mq-listen.yaml
images:
  # Image name used in base and overlays must be the same for image replacement to work
  - name: PATCH_NGINX_IMAGE
    newName: git.app.uib.no:4567/it/site/w4.uib.no/w4-nginx
    newTag: next-major-14626 # {"$imagepolicy": "adm-it-pub:w4-next-major-nginx-image-policy:tag"}
  # Image name used in base and overlays must be the same for image replacement to work
  - name: PATCH_PHP_FPM_IMAGE
    newName: git.app.uib.no:4567/it/site/w4.uib.no/w4-php-fpm
    newTag: next-major-14626 # {"$imagepolicy": "adm-it-pub:w4-next-major-php-fpm-image-policy:tag"}
