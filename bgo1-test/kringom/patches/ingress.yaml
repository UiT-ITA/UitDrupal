# TODO: Improve this patch
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${app_name}-nginx
spec:
  rules:
  - host: ${app_name}.${rail_region}.${rail_env}.rail.uib.no
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: varnish-cache
            port:
              number: 6081
  - host: ${app_name}-novarnish.${rail_region}.${rail_env}.rail.uib.no
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: ${app_name}-nginx
              port:
                number: 80
  - host: kringom.test.uib.no
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: varnish-cache
            port:
              number: 6081
  - host: kringom-novarnish.test.uib.no
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ${app_name}-nginx
            port:
              number: 80
  tls:
  - hosts:
    - ${app_name}.${rail_region}.${rail_env}.rail.uib.no
    - ${app_name}-novarnish.${rail_region}.${rail_env}.rail.uib.no
    - kringom.test.uib.no
    - kringom-novarnish.test.uib.no
    secretName: ${app_name}.${rail_region}.${rail_env}.rail.uib.no-tls
