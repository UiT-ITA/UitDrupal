apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mariadb-access
  namespace: adm-it-pub-turspor
spec:
  podSelector:
    matchLabels:
      app: turspor-mariadb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: turspor
      ports:
        - protocol: TCP
          port: 3306
