server {
    listen 8080;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    # Enable debug logging
    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log;

    # These should never need to be accessed.
    location ~ ^/(install|update|authorize|xmlrpc|cron)\.php$|~*\.(module|inc|install|engine|theme|tpl(\.php)?|info|po|sh|.*sql|xtmpl)$ {
        deny all;
    }
    location ~* \.(txt|log)$ {
        deny all;
    }
    # Deny access to hidden files
    location ~ (^|/)\. {
        deny all;
    }
    # Deny access to .htaccess files
    location ~ /\.ht {
        deny all;
    }

    # Serve static files directly
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|pdf|zip|tar|gz|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Handle Drupal's clean URLs
    location / {
        try_files $uri /index.php?$args;
    }

    # Handle PHP files via FastCGI
    location ~ \.php$ {
        include fastcgi_params;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_index index.php;
        fastcgi_pass ${app_name}-php-fpm:9000;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_intercept_errors on;
    }

    # NB: Make sure to update php.ini if changed.
    client_max_body_size 128M;
    client_body_buffer_size 128k;
}