apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${app_name}-php-fpm
spec:
  template:
    metadata:
      labels:
        app: ${app_name}-php-fpm
    spec:
      containers:
        - name: ${app_name}-php-fpm
          volumeMounts:
            - name: tmp
              mountPath: /tmp
              readOnly: false
            - name: phpfpm-config
              mountPath: /usr/local/etc/php-fpm.d/zz-docker.conf
              subPath: zz-docker.conf
            - name: php-config
              mountPath: /usr/local/etc/php/conf.d/99-php-fpm.ini
              subPath: 99-php-fpm.ini
      volumes:
        - name: tmp
          emptyDir: {}
        - name: phpfpm-config
          configMap:
            name: phpfpm-config
        - name: php-config
          configMap:
            name: php-config
