apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../components/nginx
  - ../../components/php-fpm
  - pvc.yaml
  - run-cron-jobs.yaml
patches:
  - path: patches/patch-php-fpm-add-volumes.yaml
configMapGenerator:
  - name: phpfpm-config
    files:
      - zz-docker.conf=www.conf
  - name: php-config
    files:
      - 99-drupal.ini=php.ini
  - name: nginx-config
    files:
      - default.conf=nginx.conf
