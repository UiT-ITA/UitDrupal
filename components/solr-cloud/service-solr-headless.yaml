apiVersion: v1
kind: Service
metadata:
  name: solr-headless
spec:
  clusterIP: None
  # Nodes must be resolvable by pod DNS name before they are ready, since that is what they register in ZooKeeper
  publishNotReadyAddresses: true
  selector:
    app: ${app_name}-solr
  ports:
    - name: http
      port: 8983
      targetPort: 8983
