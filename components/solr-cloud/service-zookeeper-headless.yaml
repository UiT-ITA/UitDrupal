apiVersion: v1
kind: Service
metadata:
  name: zookeeper-hs
  labels:
    app: ${app_name}-zookeeper
spec:
  clusterIP: None
  # Peers must resolve each other before any of them is ready, otherwise leader election never starts
  publishNotReadyAddresses: true
  selector:
    app: ${app_name}-zookeeper
  ports:
    - name: client
      port: 2181
      targetPort: 2181
    - name: peer
      port: 2888
      targetPort: 2888
    - name: election
      port: 3888
      targetPort: 3888
