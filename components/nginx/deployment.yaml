apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${app_name}-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${app_name}-nginx
      app.kubernetes.io/name: ${app_name}-nginx
      app.kubernetes.io/instance: ${app_name}-nginx
  template:
    metadata:
      labels:
        app: ${app_name}-nginx
        app.kubernetes.io/name: ${app_name}-nginx
        app.kubernetes.io/instance: ${app_name}-nginx
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        fsGroupChangePolicy: "OnRootMismatch"
      imagePullSecrets:
        - name: ${image_pull_secret_name}
      containers:
        - name: ${app_name}-nginx
          image: PATCH_NGINX_IMAGE
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
              readOnly: false
            - name: tmp
              mountPath: /tmp
              readOnly: false
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            fsGroup: 33
            fsGroupChangePolicy: "OnRootMismatch"
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: nginx-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
