apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${app_name}-nginx
  annotations:
    cert-manager.io/cluster-issuer: harica
    cert-manager.io/private-key-algorithm: ECDSA
    cert-manager.io/usages: "digital signature"
    cert-manager.io/private-key-rotation-policy: Always
    # UiB's ip ranges and rail's ip ranges for the RAIL NAT gws
    nginx.ingress.kubernetes.io/whitelist-source-range: 129.177.0.0/16,2001:700:200::/48,158.39.77.248,158.39.74.248,158.37.63.248,158.39.75.248,2001:700:2:8303::/64,2001:700:2:8203::/64,2001:700:2:8302::/122,2001:700:2:8202::/122
spec:
  ingressClassName: nginx
  rules:
  - host: ${app_name}.${rail_region}.${rail_env}.rail.uib.no
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ${app_name}-nginx
            port:
              number: 80
  tls:
  - hosts:
    - ${app_name}.${rail_region}.${rail_env}.rail.uib.no
    secretName: ${app_name}.${rail_region}.${rail_env}.rail.uib.no-tls