apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${app_name}-php-fpm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${app_name}-php-fpm
      app.kubernetes.io/name: ${app_name}-php-fpm
      app.kubernetes.io/instance: ${app_name}-php-fpm
  template:
    metadata:
      labels:
        app: ${app_name}-php-fpm
        app.kubernetes.io/name: ${app_name}-php-fpm
        app.kubernetes.io/instance: ${app_name}-php-fpm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        fsGroupChangePolicy: "OnRootMismatch"
      imagePullSecrets:
        - name: ${image_pull_secret_name}
      containers:
        - name: ${app_name}-php-fpm
          image: PATCH_PHP_FPM_IMAGE
          ports:
            - name: fastcgi
              containerPort: 9000
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1"
          # Prevent escalation attacks
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            fsGroup: 33
            fsGroupChangePolicy: "OnRootMismatch"
        - name: ${app_name}-php-fpm-exporter
          image: "git.app.uib.no:4567/itpublic/dockerimages/php-fpm_exporter/php-fpm_exporter:503a8044"
          env:
            - name: PHP_FPM_WEB_LISTEN_ADDRESS
              value: ":9253"
            - name: PHP_FPM_SCRAPE_URI
              value: "tcp://localhost:9000/status"
            - name: PHP_FPM_FIX_PROCESS_COUNT
              value: "true"
          ports:
            - name: metrics
              containerPort: 9253
              protocol: TCP
          resources:
            requests:
              memory: "64M"
              cpu: "100m"
            limits:
              memory: "64M"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
