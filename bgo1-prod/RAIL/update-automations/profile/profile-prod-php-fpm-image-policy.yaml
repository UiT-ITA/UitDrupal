apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: profile-prod-php-fpm-image-policy
spec:
  imageRepositoryRef:
    name: profile-php-fpm-image-repository
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+)$'
    extract: '$version.0'
  policy:
    semver:
      range: ">=1.0.0"
