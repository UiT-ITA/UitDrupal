apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: skeivtarkiv-test-php-fpm-image-policy
spec:
  imageRepositoryRef:
    name: skeivtarkiv-php-fpm-image-repository
  filterTags:
    pattern: "^test-(?P<build>[0-9]+)$"
    extract: "$build"
  policy:
    numerical:
      order: asc
