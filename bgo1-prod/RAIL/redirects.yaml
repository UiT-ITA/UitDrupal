apiVersion: hnc.x-k8s.io/v1alpha2
kind: SubnamespaceAnchor
metadata:
  name: adm-it-pub-redirects
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: adm-it-pub-redirects
spec:
  sourceRef:
    kind: GitRepository
    name: adm-it-pub
  path: base/redirects
  targetNamespace: adm-it-pub-redirects
  prune: true
  wait: true
  interval: 30m0s
  retryInterval: 2m0s
  timeout: 3m0s
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  postBuild:
    substitute:
      app_name: redirects
      image_pull_secret_name: gitapp-adm-it-pub-systembruker
      rail_cluster: bgo1-prod
      rail_env: prod
      rail_region: bgo1
