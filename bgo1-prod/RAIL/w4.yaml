      self_file_s3: s3://w4.uib.no/bgo1-prod/w4/files
      # Files S3: endpoint for this region’s object store
      self_file_s3_endpoint: https://object.api.bgo.nrec.no
      # Files S3: source bucket/prefix to read from when replicating into this region
      source_file_s3: s3://w4.uib.no/osl1-prod/w4/files
      # Files S3: endpoint for the source region’s object store
      source_file_s3_endpoint: https://object.api.osl.nrec.no

      # Assets S3: this region’s bucket/prefix for "assets"
      self_assets_s3: s3://w4.uib.no/bgo1-prod/w4/assets
      # Assets S3: endpoint for this region’s object store
      self_assets_s3_endpoint: https://object.api.bgo.nrec.no
      # Assets S3: source bucket/prefix to read from when replicating into this region
      source_assets_s3: s3://w4.uib.no/osl1-prod/w4/assets
      # Assets S3: endpoint for the source region’s object store
      source_assets_s3_endpoint: https://object.api.osl.nrec.no

      # Workload: "true" disables most cron jobs to avoid double runs
      is_replica: "false"
      # MQ: replicas must not consume jobs/messages (set to "1" only in the primary region once it is ready to consume)
      mq_listen_replicas: "1"
      # Files: pause local to S3 sync (replicas should be "true" to avoid overwriting)
