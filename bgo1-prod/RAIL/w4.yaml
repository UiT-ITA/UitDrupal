apiVersion: hnc.x-k8s.io/v1alpha2
kind: SubnamespaceAnchor
metadata:
  name: adm-it-pub-w4
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: adm-it-pub-w4
spec:
  sourceRef:
    kind: GitRepository
    name: adm-it-pub
  path: ${rail_cluster}/w4
  targetNamespace: adm-it-pub-w4
  prune: true
  wait: true
  interval: 30m0s
  retryInterval: 2m0s
  timeout: 3m0s
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  postBuild:
    substitute:
      app_name: w4
      image_pull_secret_name: gitapp-adm-it-pub-systembruker
      rail_cluster: bgo1-prod
      rail_env: prod
      rail_region: bgo1
      drupal_env: prod
      drupal_trusted_host_patterns: '(w4|www|www-pilot\.test|w4-backend1\.app|w4\.bgo1\.prod\.rail)\.uib\.no'
      w4_nginx_service: w4-nginx

      # Database replication

      # CNPG: cluster that should be treated as primary. It should match in all regions
      primary_cluster: w4-bgo1-prod
      # CNPG: cluster to pull WAL from when this region is a replica
      source_cluster: w4-osl1-prod
      # CNPG: current cluster name
      self_cluster: w4-bgo1-prod
      # CNPG: token required to promote in a controlled handover (empty unless promoting this region)
      promotion_token: ""

      # Files S3: this region’s bucket/prefix for Drupal "files"
      self_file_s3: s3://w4.uib.no/bgo1-prod/w4/files
      # Files S3: endpoint for this region’s object store
      self_file_s3_endpoint: https://object.api.bgo.nrec.no
      # Files S3: source bucket/prefix to read from when replicating into this region
      source_file_s3: s3://w4.uib.no/osl1-prod/w4/files
      # Files S3: endpoint for the source region’s object store
      source_file_s3_endpoint: https://object.api.osl.nrec.no

      # Assets S3: this region’s bucket/prefix for "assets"
      self_assets_s3: s3://w4.uib.no/bgo1-prod/w4/assets
      # Assets S3: endpoint for this region’s object store
      self_assets_s3_endpoint: https://object.api.bgo.nrec.no
      # Assets S3: source bucket/prefix to read from when replicating into this region
      source_assets_s3: s3://w4.uib.no/osl1-prod/w4/assets
      # Assets S3: endpoint for the source region’s object store
      source_assets_s3_endpoint: https://object.api.osl.nrec.no

      # Workload: "true" disables most cron jobs to avoid double runs
      is_replica: "false"
      # MQ: replicas must not consume jobs/messages (set to "1" only in the primary region once it is ready to consume)
      mq_listen_replicas: "1"
      # Files: pause local to S3 sync (replicas should be "true" to avoid overwriting)
      suspend_sync_files: "false"
      # Files: pause cross-region S3 to S3 replication (primary should be "true"; replicas "false")
      suspend_replicate_files: "true"
      # PHP-FPM: mount persistent volume read-only on replicas (stops application from allowing file uploads)
      phpfpm_pvm_readonly: "false"
      # Backup: suffix/prefix used in S3 backup destination paths
      backup_name: w4
      # Varnish-cluster resources
      VARNISH_SERVER_MEMORY_REQUEST: 2304Mi
      VARNISH_SERVER_MEMORY_LIMIT: 2304Mi
      VARNISH_SIZE: 1536m
      VARNISH_TRANSIENT_SIZE: 256m
      VARNISH_MALLOC_CONF: "background_thread:true,narenas:2,dirty_decay_ms:1000,muzzy_decay_ms:1000,metadata_thp:disabled"
---
# post deploy
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: adm-it-pub-w4-post-deploy
spec:
  dependsOn:
    - name: adm-it-pub-w4
  sourceRef:
    kind: GitRepository
    name: adm-it-pub
  path: ${rail_cluster}/w4/post-deploy
  targetNamespace: adm-it-pub-w4
  prune: true
  wait: true
  force: true
  interval: 30m0s
  retryInterval: 2m0s
  timeout: 3m0s
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  postBuild:
    substitute:
      app_name: w4
      image_pull_secret_name: gitapp-adm-it-pub-systembruker
