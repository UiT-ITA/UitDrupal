apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/shared
  - ../../base/git-pull-secrets
  - imagepolicy.yaml
  - imagerepo.yaml
  - imageupdater.yaml
images:
  - name: git.app.uib.no:4567/it/site/shared.app.uib.no/shared
    newTag: prod-2026-03-11T0732 # {"$imagepolicy": "adm-it-pub-shared:shared:tag"}
# Remove IP block, adding beginning of the file until the target value
# and then replace (in this case with null)
# Official name: Strategic merge
patches:
  - patch: |
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: shared
        annotations:
          nginx.ingress.kubernetes.io/whitelist-source-range: null
