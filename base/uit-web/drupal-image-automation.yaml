---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: drupal
spec:
  image: uitcontainerregistry.azurecr.io/uit/www-uit-no
  interval: 1m3s
  provider: generic
  secretRef:
    name: ${image_pull_secret_name}

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: drupal
spec:
  imageRepositoryRef:
    name: drupal
  filterTags:
    pattern: '^${app_name}-${app_env}-(?P<version>\d*)-.*$'
    extract: '$version'
  digestReflectionPolicy: IfNotPresent
  policy:
    numerical:
      order: asc
