---
apiVersion: v1
kind: Service
metadata:
  name: rsyslog
  labels:
    app.kubernetes.io/name: rsyslog
spec:
  selector:
    app.kubernetes.io/name: rsyslog
  ports:
    - name: rsyslog-tcp
      port: 514
      protocol: TCP
      targetPort: rsyslog-tcp
    - name: rsyslog-udp
      port: 514
      protocol: UDP
      targetPort: rsyslog-udp
