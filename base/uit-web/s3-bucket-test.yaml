---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: s3-bucket-test
  labels:
    app.kubernetes.io/name: s3-bucket-test
    uit.no/bucket-name: ${s3_bucket_test}
spec:
  # This will ensure that barman retains at least one backup older than 30 days
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://${s3_bucket_test}/postgres-backups/
    endpointURL: https://${s3_endpoint}
    s3Credentials:
      accessKeyId:
        name: s3-bucket-test
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: s3-bucket-test
        key: ACCESS_SECRET_KEY
    wal:
      compression: zstd
    data:
      compression: bzip2
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
