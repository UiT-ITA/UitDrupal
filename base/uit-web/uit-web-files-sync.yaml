apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${app_name}-sync-files-to-s3
spec:
  schedule: "${files_backup_schedule:-none}"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  suspend: ${backup_suspend_files:=false}
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: ${app_name}-sync-files
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            fsGroup: 33
            fsGroupChangePolicy: "OnRootMismatch"
          containers:
            - name: ${app_name}-sync-files
              image: uitcontainerregistry.azurecr.io/uit/aws-cli # tag is set per instance (images in the instance kustomization)
              command:
                - /bin/sh
                - -c
                - "/sync-s3-script/script.sh /files $S3_BUCKET"
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
                runAsNonRoot: true
                runAsUser: 33
                runAsGroup: 33
              resources:
                requests:
                  memory: "2Gi"
                  cpu: "1"
                limits:
                  cpu: "1"
                  memory: "2Gi"
              volumeMounts:
                - name: ${app_name}-files
                  mountPath: /files
                - name: sync-s3-script
                  mountPath: /sync-s3-script
                  readOnly: true
              env:
                - name: AWS_REGION
                  value: ${s3_region}
                - name: AWS_REQUEST_CHECKSUM_CALCULATION
                  value: when_required
                - name: AWS_RESPONSE_CHECKSUM_VALIDATION
                  value: when_required
                - name: DELETE
                  value: "true"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: ACCESS_SECRET_KEY
                - name: S3_BUCKET
                  value: s3://${s3_bucket}
                - name: AWS_ENDPOINT_URL
                  value: https://${s3_endpoint}
          volumes:
            - name: ${app_name}-files
              persistentVolumeClaim:
                claimName: ${app_name}-files
            - name: sync-s3-script
              configMap:
                name: sync-s3-script
                defaultMode: 0755
          imagePullSecrets:
            - name: ${image_pull_secret_name}
