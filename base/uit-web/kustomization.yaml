apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/instance: "${app_env}"
      app.kubernetes.io/part-of: "${app_name}"
    includeSelectors: true
    includeTemplates: true
resources:
  - database.yaml
  - drupal-deployment.yaml
  - drupal-fs-utvekslingsavtaler-apikey.yaml
  - drupal-iknowbase-graphql-studiekatalog-apikey.yaml
  - drupal-image-automation.yaml
  - drupal-orgreg-apikey.yaml
  - drupal-service.yaml
  - drupal-service-monitor.yaml
  - feide-client-secret.yaml
  - ingress.yaml
  - nginx-deployment.yaml
  - nginx-image-automation.yaml
  - nginx-service.yaml
  - openai-apikey.yaml
  - post-deploy-job.yaml
  - rsyslog-deployment.yaml
  - rsyslog-service.yaml
  - uit-drupal-push-automation.yaml
  - uit-drupal-push-repo.yaml
  - uit-drupal-push-secret.yaml
  - uit-web-files-pvc.yaml
