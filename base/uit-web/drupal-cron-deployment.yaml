---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drupal-cron
  labels:
    app.kubernetes.io/name: drupal-cron
    app: drupal-cron
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: drupal-cron
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drupal-cron
        app: drupal-cron
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: cron
          command:
            - supercronic
            - /etc/crontabs/www-data
          env:
            # Application configuration
            - name: POSTGRES_DB
              value: drupal
            - name: POSTGRES_HOST
              value: ${app_name}-${app_env}-db${db_generation}-rw
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-drupal-user
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-drupal-user
                  key: password
            - name: UIT_ORGREG_APIKEY
              valueFrom:
                secretKeyRef:
                  name: drupal-orgreg-apikey
                  key: password
            - name: UIT_FS_UTVEKSLINGSAVTALER_APIKEY
              valueFrom:
                secretKeyRef:
                  name: drupal-fs-utvekslingsavtaler-apikey
                  key: password
            - name: UIT_IKNOWBASE_GRAPHQL_STUDIEKATALOG_APIKEY
              valueFrom:
                secretKeyRef:
                  name: drupal-iknowbase-graphql-studiekatalog-apikey
                  key: password
            - name: UIT_DRUPALAI_APIKEY
              valueFrom:
                secretKeyRef:
                  name: openai-apikey
                  key: password
            - name: OPENID_CONNECT_FEIDE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: feide-client-secret
                  key: password
          image: uitcontainerregistry.azurecr.io/uit/www-uit-no # tag is set per instance (images in the instance kustomization)
          volumeMounts:
            - name: crontab
              mountPath: /etc/crontabs/www-data
              subPath: crontab
            - name: settings-php
              mountPath: /var/www/html/web/sites/default/settings.php
              subPath: settings.php
            - name: salt-txt
              mountPath: /var/local/salt.txt
              subPath: salt.txt
            - name: ${app_name}-files
              mountPath: /var/www/html/web/sites/default/files
          ports:
            - containerPort: 9000
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type:
                RuntimeDefault
      volumes:
        - name: settings-php
          configMap:
            name: settings-php
        - name: salt-txt
          secret:
            secretName: drupal-hash-salt
        - name: ${app_name}-files
          persistentVolumeClaim:
            claimName: ${app_name}-files
        - name: crontab
          configMap:
            name: drupal-crontab
      imagePullSecrets:
        - name: ${image_pull_secret_name}
