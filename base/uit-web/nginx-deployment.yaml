---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: nginx
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
        app: nginx
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        # The files volume is shared with drupal, which writes to it. Use the
        # same group as drupal (www-data, 33), nginx only needs to read.
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: nginx
          image: uitcontainerregistry.azurecr.io/uit/www-uit-no-nginx # tag is set per instance (images in the instance kustomization)
          volumeMounts:
            - name: ${app_name}-files
              mountPath: /var/www/html/web/sites/default/files
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "20Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type:
                RuntimeDefault
      volumes:
        - name: "${app_name}-files"
          persistentVolumeClaim:
            claimName: ${app_name}-files
      imagePullSecrets:
        - name: ${image_pull_secret_name}
