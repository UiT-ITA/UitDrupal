---
# Post deployment tasks (drush deploy) once per release.
#
# The image is the same as the drupal deployment and is set per instance by
# the images transformer. A new image tag changes the Job spec, Jobs are
# immutable, so Flux recreates it (force annotation) and it runs again.
# The script lives in www.uit.no: scripts/deploy/post-deploy.sh
apiVersion: batch/v1
kind: Job
metadata:
  name: drupal-post-deploy
  labels:
    app.kubernetes.io/name: drupal-post-deploy
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drupal-post-deploy
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
      containers:
        - name: post-deploy
          image: uitcontainerregistry.azurecr.io/uit/www-uit-no # tag is set per instance (images in the instance kustomization)
          command:
            - /var/www/html/scripts/deploy/post-deploy.sh
          env:
            - name: POSTGRES_DB
              value: drupal
            - name: POSTGRES_HOST
              value: drupal-db-rw
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-drupal-user
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-drupal-user
                  key: password
            - name: UIT_ORGREG_APIKEY
              valueFrom:
                secretKeyRef:
                  name: drupal-orgreg-apikey
                  key: password
            - name: UIT_FS_UTVEKSLINGSAVTALER_APIKEY
              valueFrom:
                secretKeyRef:
                  name: drupal-fs-utvekslingsavtaler-apikey
                  key: password
            - name: UIT_IKNOWBASE_GRAPHQL_STUDIEKATALOG_APIKEY
              valueFrom:
                secretKeyRef:
                  name: drupal-iknowbase-graphql-studiekatalog-apikey
                  key: password
            - name: UIT_DRUPALAI_APIKEY
              valueFrom:
                secretKeyRef:
                  name: openai-apikey
                  key: password
            - name: OPENID_CONNECT_FEIDE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: feide-client-secret
                  key: password
          volumeMounts:
            - name: settings-php
              mountPath: /var/www/html/web/sites/default/settings.php
              subPath: settings.php
            - name: salt-txt
              mountPath: /var/local/salt.txt
              subPath: salt.txt
            - name: ${app_name}-files
              mountPath: /var/www/html/web/sites/default/files
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type:
                RuntimeDefault
      volumes:
        - name: settings-php
          configMap:
            name: settings-php
        - name: salt-txt
          secret:
            secretName: drupal-hash-salt
        - name: ${app_name}-files
          persistentVolumeClaim:
            claimName: ${app_name}-files
      imagePullSecrets:
        - name: ${image_pull_secret_name}
