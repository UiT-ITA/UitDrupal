---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: uit-drupal-push
spec:
  git:
    checkout:
      ref:
        branch: main
    push:
      branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@noreply.uib.no
      messageTemplate: '{{ .AutomationObject }}: {{range .Changed.Changes}}{{print .OldValue}} -> {{println .NewValue}}{{end}}'
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: uit-drupal-push
  update:
    strategy: Setters
    path: ${rail_cluster}/${app_name}-${app_env}
