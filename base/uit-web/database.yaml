---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: drupal-db
  labels:
    app.kubernetes.io/name: drupal-db
spec:
  instances: 2
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      database: drupal
      owner: drupal
      secret:
        name: db-drupal-user
  storage:
    size: 16Gi

  postgresql:
    parameters:
      shared_buffers: "256MB"

  resources:
    requests:
      memory: "384Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
