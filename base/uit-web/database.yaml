---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${app_name}-${app_env}-db${db_generation}
  labels:
    app.kubernetes.io/name: ${app_name}-${app_env}-db${db_generation}
spec:
  instances: 2
  monitoring:
    enablePodMonitor: true
  bootstrap:
    recovery:
      database: drupal
      owner: drupal
      source: source
      recoveryTarget:
        targetTime: ${db_source_timestamp}
  storage:
    size: 16Gi

  postgresql:
    parameters:
      shared_buffers: "256MB"

  resources:
    requests:
      memory: "384Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: ${db_backup_bucket}

  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: ${db_source_bucket}
          serverName: ${db_source_instance}

---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: ${app_name}-${app_env}-db${db_generation}
  labels:
    app.kubernetes.io/name: ${app_name}-${app_env}-db${db_generation}
spec:
  immediate: true # Also trigger a backup when creating this resource
  cluster:
    name: ${app_name}-${app_env}-db${db_generation}
  schedule: "${db_backup_schedule}"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
