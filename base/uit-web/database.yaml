---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: drupal-db
  labels:
    app.kubernetes.io/name: drupal-db
spec:
  instances: 2
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      database: drupal
      owner: drupal
      secret:
        name: db-drupal-user
  storage:
    size: 16Gi

  postgresql:
    parameters:
      shared_buffers: "256MB"

  resources:
    requests:
      memory: "384Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backblaze

---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: drupal-db
  labels:
    app.kubernetes.io/name: drupal-db
spec:
  immediate: true # Also trigger a backup when creating this resource
  cluster:
    name: drupal-db
  schedule: '0 0 21 * * *' # Every 6th day at 18:00
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
