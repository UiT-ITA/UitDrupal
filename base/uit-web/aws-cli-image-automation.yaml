---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: aws-cli
spec:
  image: uitcontainerregistry.azurecr.io/uit/aws-cli
  interval: 1m3s
  provider: generic
  secretRef:
    name: ${image_pull_secret_name:-none}

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: aws-cli
spec:
  imageRepositoryRef:
    name: aws-cli
  filterTags:
    pattern: '^\d*\.\d*-\d{4}$'
  digestReflectionPolicy: IfNotPresent
  policy:
    alphabetical:
      order: asc
