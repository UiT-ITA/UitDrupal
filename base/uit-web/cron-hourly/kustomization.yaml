apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../uit-web-cronjob
nameSuffix: -hourly
patches:
- target:
    group: batch
    version: v1
    kind: CronJob
    name: drupal-cronjob
  patch: |-
    - op: replace
      path: /spec/schedule
      value: "45 * * * *"

    - op: replace
      path: /spec/jobTemplate/spec/template/spec/containers/0/command
      value:
      - drush
      - cron
