apiVersion: apps/v1
kind: Deployment
metadata:
  name: rom
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rom
      app.kubernetes.io/instance: rom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rom
        app.kubernetes.io/instance: rom
    spec:
      imagePullSecrets:
        - name: gitapp-adm-it-pub-systembruker
      containers:
        - name: rom
          image: git.app.uib.no:4567/it/site/rom.app.uib.no/rom:master-2026-03-19T0253-958a5527 #{"$imagepolicy": "adm-it-pub:rom-test"}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2048Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
