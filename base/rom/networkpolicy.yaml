apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rom
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rom
      app.kubernetes.io/instance: rom
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
