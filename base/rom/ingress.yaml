apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rom
  annotations:
    cert-manager.io/cluster-issuer: harica
    cert-manager.io/private-key-algorithm: ECDSA
    cert-manager.io/usages: "digital signature"
    cert-manager.io/private-key-rotation-policy: Always
    nginx.ingress.kubernetes.io/whitelist-source-range: 129.177.0.0/16,2001:700:200::/48
spec:
  ingressClassName: nginx
  rules:
  - host: rom.${rail_region}.${rail_env}.rail.uib.no
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rom
            port:
              name: http
  - host: rom.${rail_env}.uib.no
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: rom
              port:
                name: http
  tls:
  - hosts:
    - rom.${rail_region}.${rail_env}.rail.uib.no
    secretName: rom.${rail_region}.${rail_env}.rail.uib.no-tls
