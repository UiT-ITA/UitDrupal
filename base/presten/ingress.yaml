apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: presten
  annotations:
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    cert-manager.io/cluster-issuer: harica
    cert-manager.io/private-key-algorithm: ECDSA
    cert-manager.io/usages: "digital signature"
spec:
  ingressClassName: nginx
  rules:
    - host: presten.${rail_region}.${rail_env}.rail.uib.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: presten
                port:
                  name: http
  tls:
    - hosts:
        - presten.${rail_region}.${rail_env}.rail.uib.no
      secretName: presten.${rail_region}.${rail_env}.rail.uib.no-tls
