apiVersion: apps/v1
kind: Deployment
metadata:
  name: presten
spec:
  replicas: 1
  selector:
    matchLabels:
      app: presten
      app.kubernetes.io/name: apache
      app.kubernetes.io/instance: presten
  template:
    metadata:
      labels:
        app: presten
        app.kubernetes.io/name: apache
        app.kubernetes.io/instance: presten
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      imagePullSecrets:
      - name: gitapp-adm-it-pub-systembruker
      containers:
      - name: nginx
        image: git.app.uib.no:4567/it/site/presten.app.uib.no/presten:prod
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
        # Prevent escalation attacks
        securityContext:
          imagePullPolicy: Always
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
