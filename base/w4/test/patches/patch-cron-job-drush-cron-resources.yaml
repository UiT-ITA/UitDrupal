apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${app_name}-drupal-run-cron
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: ${app_name}-drupal
            resources:
              requests:
                cpu: "200m"
                memory: "256Mi"
              limits:
                cpu: "500m"
                memory: "1Gi"
