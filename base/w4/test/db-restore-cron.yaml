apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${app_name}-db-restore-cron
spec:
  schedule: "35 2 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Replace
  suspend: ${is_replica:=false}
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: ${app_name}-db-restore-cron
        spec:
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            fsGroup: 33
            fsGroupChangePolicy: "OnRootMismatch"
          imagePullSecrets:
            - name: gitapp-adm-it-pub-systembruker
          initContainers:
            - name: download-today-s3-script
              image: git.app.uib.no:4567/itpublic/dockerimages/awscli/amazon/aws-cli:2.33.7
              command:
                - /bin/sh
                - -c
                - "/download-today-s3/script.sh $S3_PATH $OUTPUT_PATH"
              volumeMounts:
                - name: aws-s3-config
                  mountPath: /tmp/.aws/config
                  subPath: config
                - mountPath: /database-dump
                  name: database-dump
                - mountPath: /download-today-s3
                  name: download-today-s3
                  readOnly: true
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 33
                runAsGroup: 33
                fsGroup: 33
                fsGroupChangePolicy: "OnRootMismatch"
              resources:
                requests:
                  memory: "1Gi"
                  cpu: "50m"
                limits:
                  memory: "2Gi"
              env:
                - name: OUTPUT_PATH
                  value: /database-dump/w4-backup.dump
                - name: S3_PATH
                  value: bgo1-prod/w4/developer-database/developer-database-{DAY_OF_WEEK}.dump
                - name: S3_BUCKET
                  value: w4.uib.no-test
                - name: AWS_REGION
                  value: None
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: ${app_name}-test-s3-secret
                      key: access
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ${app_name}-test-s3-secret
                      key: secret
                - name: AWS_ENDPOINT_URL
                  value: https://object.api.bgo.nrec.no
          containers:
            - name: drush-run-query
              image: PATCH_PHP_FPM_IMAGE
              command:
                ["/restore-pg-db/script.sh", "/database-dump/w4-backup.dump"]
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 33
                runAsGroup: 33
                fsGroup: 33
                fsGroupChangePolicy: "OnRootMismatch"
              resources:
                requests:
                  memory: "1Gi"
                  cpu: "500m"
                limits:
                  memory: "1Gi"
              volumeMounts:
                - name: aws-s3-config
                  mountPath: /tmp/.aws/config
                  subPath: config
                - name: phpfpm-config
                  mountPath: /usr/local/etc/php-fpm.d/zz-docker.conf
                  subPath: zz-docker.conf
                - name: php-config
                  mountPath: /usr/local/etc/php/conf.d/99-php-fpm.ini
                  subPath: 99-php-fpm.ini
                - mountPath: /var/www/html/web/sites/default/files
                  name: files
                  readOnly: ${phpfpm_pvm_readonly:=false}
                - name: assets
                  mountPath: /var/www/html/web/sites/default/assets
                  readOnly: ${phpfpm_pvm_readonly:=false}
                - name: tmp
                  mountPath: /tmp
                  readOnly: false
                - mountPath: /database-dump
                  name: database-dump
                - mountPath: /restore-pg-db
                  name: restore-pg-db
                  readOnly: true
              env:
                # TODO: Move to overlay
                - name: DRUPAL_UIB_ENV
                  value: test
                - name: DRUPAL_UIB_FILE_ASSETS_PATH
                  value: sites/default/assets
                - name: DRUPAL_DATABASE_HOST
                  value: ${app_name}-db-rw
                - name: DRUPAL_DATABASE_PREFIX
                  value: ""
                - name: DRUPAL_DATABASE_NAME
                  value: ${app_name}
                - name: DRUPAL_DATABASE_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: ${app_name}-db-secret
                      key: username
                - name: DRUPAL_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${app_name}-db-secret
                      key: password
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${app_name}-db-secret
                      key: password
                # Varnish ban token
                - name: VARNISH_BAN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: ${app_name}-varnish-ban-token
                      key: varnish_ban_token

                # Valkey authentication
                - name: DRUPAL_REDIS_HOST
                  value: ${app_name}-valkey
                - name: DRUPAL_REDIS_PORT
                  value: "6379"
                - name: DRUPAL_REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${app_name}-valkey-secret
                      key: password

          volumes:
            - name: aws-s3-config
              configMap:
                name: aws-s3-config
                defaultMode: 0644
            - name: phpfpm-config
              configMap:
                name: phpfpm-config
            - name: php-config
              configMap:
                name: php-config
            - name: files
              persistentVolumeClaim:
                claimName: ${app_name}-files
            - name: assets
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: database-dump
              emptyDir: {}
            - name: download-today-s3
              configMap:
                name: download-today-s3-script
                defaultMode: 0755
            - name: restore-pg-db
              configMap:
                name: restore-pg-db-script
                defaultMode: 0755
          restartPolicy: Never
