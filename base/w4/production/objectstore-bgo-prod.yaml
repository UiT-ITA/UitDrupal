apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: w4-bgo1-prod-db-store
spec:
  # This will ensure that barman retains at least one backup older than 30 days
  retentionPolicy: "30d"
  configuration:
    endpointURL: https://object.api.bgo.nrec.no
    destinationPath: s3://w4.uib.no/bgo1-prod/${backup_name}/postgres
    s3Credentials:
      accessKeyId:
        name: ${app_name}-prod-s3-secret
        key: access
      secretAccessKey:
        name: ${app_name}-prod-s3-secret
        key: secret
    wal:
      compression: zstd
    data:
      compression: bzip2
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
