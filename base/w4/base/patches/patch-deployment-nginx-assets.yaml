apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${app_name}-nginx
spec:
  template:
    metadata:
      labels:
        app: ${app_name}-nginx
    spec:
      volumes:
        - name: assets
          persistentVolumeClaim:
            claimName: ${app_name}-assets
      containers:
        - name: ${app_name}-nginx
          volumeMounts:
            - mountPath: /var/www/html/web/sites/default/assets
              name: assets
              readOnly: true
