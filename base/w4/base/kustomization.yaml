apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/git-pull-secrets
  - ../../../components/drupal11
  - ../../../components/postgres
  - ../../../components/valkey-cluster
  - ../../../components/varnish-cluster
  - cronjob-clear-room-cache.yaml
  - cronjob-sync-courses.yaml
  - cronjob-sync-disputations.yaml
  - cronjob-sync-study-programs.yaml
  - cronjob-users-sync-all.yaml
  - statefulset-mq-listen.yaml
patches:
  - path: patches/patch-cluster-db-pg.yaml
  - path: patches/patch-deployment-php-fpm-env.yaml
  - path: patches/patch-deployment-php-fpm-opcache.yaml
  - path: patches/patch-deployment-php-fpm-resources.yaml
  - path: patches/patch-deployment-php-fpm-assets.yaml
  - path: patches/patch-deployment-php-fpm-fs-group-change-policy.yaml
  - path: patches/patch-deployment-nginx-assets.yaml
  - path: patches/patch-deployment-nginx-fs-group-change-policy.yaml
  - path: patches/patch-deployment-nginx-resources.yaml
  - path: patches/patch-cron-job-drush-cron-assets.yaml
  - path: patches/patch-cron-job-drush-cron-env.yaml
  - path: patches/patch-cron-job-drush-cron-resources.yaml
  - path: patches/patch-cron-job-drush-cron-fs-group-change-policy.yaml
  - path: patches/patch-pvc-assets.yaml
images:
  - name: PATCH_VARNISH_IMAGE
    newName: git.app.uib.no:4567/itpublic/dockerimages/varnish-unprivileged
    newTag: 6.0.18 # {"$imagepolicy": "adm-it-pub:varnish-6.0-image-policy:tag"}
  - name: PATCH_VALKEY_IMAGE
    newName: git.app.uib.no:4567/itpublic/dockerimages/valkey-unprivileged
    newTag: 9.0.6 # {"$imagepolicy": "adm-it-pub:valkey-9.0-image-policy:tag"}
configMapGenerator:
  - name: aws-s3-config
    files:
      - config=aws-s3-config
  - name: ${app_name}-varnish-config
    options:
      disableNameSuffixHash: true
    files:
      - default.vcl=drupal-varnish-cluster.vcl
  - name: opcache-config
    files:
      - zzz-php-opcache.ini=opcache.ini
  - name: course-sync-php-config
    files:
      - 999-sync-courses-php.ini=sync-courses-php.ini
