apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xyzzy
  annotations:
    cert-manager.io/cluster-issuer: sectigo-clusterwide
    spec.ingressClassName: nginx
spec:
  rules:
  - host: xyzzy.bgo1.prod.rail.uhdc.no
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: xyzzy
            port:
              name: http
  tls:
  - hosts:
    - xyzzy.bgo1.prod.rail.uhdc.no
    secretName: xyzzy.bgo1.prod.rail.uhdc.no-tls
