apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/instance: "${app_env}"
      app.kubernetes.io/part-of: "${app_name}"
    includeSelectors: true
    includeTemplates: true
resources:
  - storybook-deployment.yaml
  - storybook-image-automation.yaml
  - storybook-service.yaml
  - ingress.yaml
  - uit-drupal-push-automation.yaml
  - uit-drupal-push-repo.yaml
  - uit-drupal-push-secret.yaml
