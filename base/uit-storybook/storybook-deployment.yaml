---
# Static Storybook of uit_theme (www.uit.no docker/storybook). nginx serves the
# Storybook build and passes story renders and theme/core assets to the Drupal
# instance in DRUPAL_BACKEND.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storybook
  labels:
    app.kubernetes.io/name: storybook
    app: storybook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storybook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storybook
        app: storybook
    spec:
      securityContext:
        runAsNonRoot: true
        # nginx user of the nginxinc/nginx-unprivileged image
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: storybook
          image: uitcontainerregistry.azurecr.io/uit/www-uit-no-storybook # tag is set per instance (images in the instance kustomization)
          env:
            - name: DRUPAL_BACKEND
              value: "${storybook_drupal_backend}"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type:
                RuntimeDefault
      imagePullSecrets:
        - name: ${image_pull_secret_name}
