apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - ./secrets
  - db-restore-cron.yaml
patches:
  - path: patches/patch-cron-job-drush-cron-resources.yaml
  - path: patches/patch-deployment-php-fpm-resources.yaml
  - path: patches/patch-drupal-run-cron.yaml
configMapGenerator:
  - name: download-today-s3-script
    files:
      - script.sh=../../../scripts/download-today-s3/download-today-s3.sh
  - name: restore-pg-db-script
    files:
      - script.sh=scripts/restore-pg-db.sh
