# Nginx configuration for redirecting requests to the Universitetsmuseet site
server {
    listen 8080;
    server_name universitetsmuseet.no www.universitetsmuseet.no;
    
    # Redirect every request to a single landing page on the new domain
    return 301 https://www4.uib.no/universitetsmuseet-i-bergen;
}

server {
    listen 8080;
    server_name universitymuseum.no www.universitymuseum.no;
    
    # Redirect every request to a single landing page on the new domain
    return 301 https://www4.uib.no/en/university-museum-of-bergen;
}