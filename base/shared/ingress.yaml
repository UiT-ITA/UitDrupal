apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shared
  annotations:
    cert-manager.io/cluster-issuer: harica
    cert-manager.io/private-key-algorithm: ECDSA
    cert-manager.io/usages: "digital signature"
    cert-manager.io/private-key-rotation-policy: Always
    nginx.ingress.kubernetes.io/whitelist-source-range: 129.177.0.0/16,2001:700:200::/48
spec:
  ingressClassName: nginx
  rules:
    - host: shared.${rail_region}.${rail_env}.rail.uib.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shared
                port:
                  name: http
    - host: shared.${rail_env}.uib.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shared
                port:
                  name: http
    - host: shared.testapp.uib.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shared
                port:
                  name: http
    - host: shared.app.uib.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shared
                port:
                  name: http
  tls:
    - hosts:
        - shared.${rail_region}.${rail_env}.rail.uib.no
      secretName: shared.${rail_region}.${rail_env}.rail.uib.no-tls
