---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: corviz
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
      app.kubernetes.io/instance: corviz
  template:
    metadata:
      labels:
        app: corviz
        app.kubernetes.io/name: nginx
        app.kubernetes.io/instance: corviz
    spec:
      imagePullSecrets: 
      - name: gitapp-adm-it-pub-systembruker
      containers:
      - name: corviz
        image: git.app.uib.no:4567/it/site/corviz/corviz:prod
        env:
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: corviz-db-secret
                key: db_user
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: corviz-db-secret
                key: db_password
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP

        # RAIL requires us to specify how resource hungry each container is
        resources:
          requests:
            cpu: 100m
            memory: 20Mi
          limits:
            cpu: 500m
            memory: 1000Mi

        # This states the defaults for the securityContext and will get rid of
        # the warning that you should set these values.  These values can not be
        # set at the Pod-level, so they need to be specified here.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type:
              RuntimeDefault
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: corviz
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nginx
      app.kubernetes.io/instance: corviz
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - port: http
    from:
