apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb-statefulset
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      volumes:
        - name: mariadb-storage
          persistentVolumeClaim:
            claimName: mariadb-pvc
      securityContext:
        runAsUser: 999  # User ID
        runAsGroup: 999  # Group ID
        #fsGroup: 2000  # File system group ID
      containers:
        - name: mariadb
          image: git.app.uib.no:4567/itpublic/dockerimages/mariadb-unprivileged/mariadb:uib-11
          env:
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: db-user-pass
                  key: mariadb_user
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-user-pass
                  key: mariadb_pw
            - name:  MARIADB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: db-user-pass
                  key: mariadb_database
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: 
                secretKeyRef:
                  name: db-user-pass 
                  key: password
          ports:
            - containerPort: 3306
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mariadb-storage
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-access
spec:
  podSelector:
    matchLabels:
      app: mariadb
  policyTypes:
  - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: corviz
    - ports:
        - port: 3306
          protocol: TCP
